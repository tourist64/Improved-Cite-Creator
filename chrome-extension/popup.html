<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Cite Creator</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    width: 300px;
    padding: 16px;
    font-size: 13px;
    color: #202124;
    margin: 0;
  }
  h2 { margin: 0 0 14px; font-size: 17px; }
  .switch { position: relative; display: inline-block; width: 52px; height: 27px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
    background: #b9b9b9; border-radius: 27px; transition: .15s;
  }
  .slider:before {
    position: absolute; content: ""; height: 21px; width: 21px; left: 3px; bottom: 3px;
    background: #fff; border-radius: 50%; transition: .15s;
  }
  .slider:after {
    content: "OFF"; position: absolute; right: 7px; top: 6px;
    font-size: 10px; font-weight: 700; color: #fff; letter-spacing: .5px;
  }
  input:checked + .slider { background: #34a853; }
  input:checked + .slider:before { transform: translateX(25px); }
  input:checked + .slider:after { content: "ON"; left: 8px; right: auto; }
  p { line-height: 1.5; margin: 12px 0; }
  code {
    background: #f1f3f4; padding: 1px 5px; border-radius: 3px;
    font-size: 11px; font-family: 'SF Mono', Menlo, Consolas, monospace;
  }
  .shortcuts div { margin: 5px 0; line-height: 1.5; }
  #optionsLink { display: inline-block; margin-top: 10px; color: #1a73e8; }
</style>
</head>
<body>
  <h2>Cite Creator</h2>

  <label class="switch">
    <input type="checkbox" id="enabled">
    <span class="slider"></span>
  </label>

  <p>Default shortcuts use Alt on PC, Option on Mac.</p>

  <div class="shortcuts" id="copyShortcut"></div>

  <p>The letter grade on each cite is a rough measure of how confident you should be in its accuracy.</p>

  <p>To manually modify parts of the cite, select text from the page and press:</p>

  <div class="shortcuts" id="fieldShortcuts"></div>

  <a href="#" id="optionsLink">Options</a>

  <script src="popup.js"></script>
</body>
</html>
