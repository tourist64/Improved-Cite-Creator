<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Cite Creator</title>
<style>
  body {
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    font-size: 13px;
    color: #202124;
    margin: 0;
    padding: 12px;
    width: 380px;
    background: #fff;
  }
  h2 {
    font-size: 15px;
    margin: 0 0 8px;
  }
  label {
    display: block;
    font-weight: 600;
    margin: 10px 0 3px;
    font-size: 12px;
  }
  input[type="text"], textarea, select {
    width: 100%;
    box-sizing: border-box;
    padding: 5px 6px;
    border: 1px solid #dadce0;
    border-radius: 4px;
    font-size: 12px;
    font-family: inherit;
  }
  textarea {
    resize: vertical;
  }
  .row {
    display: flex;
    gap: 8px;
  }
  .row > div {
    flex: 1;
  }
  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 6px;
  }
  .checkbox-row label {
    margin: 0;
    font-weight: normal;
  }
  .btn-row {
    display: flex;
    gap: 8px;
    margin-top: 8px;
  }
  .btn-row button {
    flex: 1;
  }
  button {
    padding: 7px 10px;
    border: none;
    border-radius: 4px;
    background: #1a73e8;
    color: white;
    font-weight: 600;
    cursor: pointer;
    font-size: 12px;
  }
  button.secondary {
    background: #f1f3f4;
    color: #202124;
  }
  button:disabled {
    opacity: 0.6;
    cursor: default;
  }
  #copyBtn {
    width: 100%;
    margin-top: 10px;
    background: #188038;
  }
  #status {
    margin-top: 8px;
    font-size: 12px;
    min-height: 16px;
  }
  .status.error {
    color: #c5221f;
  }
  #preview {
    height: 84px;
    background: #f8f9fa;
  }
  details {
    margin-top: 16px;
    border-top: 1px solid #e0e0e0;
    padding-top: 8px;
  }
  summary {
    cursor: pointer;
    font-weight: 600;
    font-size: 12px;
  }
  hr {
    border: none;
    border-top: 1px solid #e0e0e0;
    margin: 14px 0;
  }
</style>
</head>
<body>
  <h2>Cite Creator</h2>

  <div class="btn-row">
    <button class="secondary" id="fetchPageBtn">Re-scan page</button>
  </div>

  <label for="url">Article URL</label>
  <input type="text" id="url" placeholder="https://...">
  <div class="btn-row">
    <button class="secondary" id="fetchUrlBtn">Fetch this URL instead</button>
  </div>

  <div id="status"></div>

  <hr>

  <div class="checkbox-row">
    <input type="checkbox" id="isOrg">
    <label for="isOrg">No individual author - cite the publication/company as author</label>
  </div>

  <div class="row">
    <div>
      <label for="first">First name</label>
      <input type="text" id="first">
    </div>
    <div>
      <label for="last">Last name / org</label>
      <input type="text" id="last">
    </div>
  </div>

  <div class="row">
    <div>
      <label for="date">Publish date</label>
      <input type="text" id="date">
    </div>
    <div>
      <label for="year">Tag year</label>
      <input type="text" id="year">
    </div>
  </div>

  <label for="title">Title</label>
  <input type="text" id="title">

  <label for="publication">Publication</label>
  <input type="text" id="publication">

  <label for="quals">Author qualifications</label>
  <input type="text" id="quals" placeholder="often needs to be filled in by hand">

  <label for="accessed">Date accessed</label>
  <input type="text" id="accessed">

  <label for="preview">Preview</label>
  <textarea id="preview" readonly></textarea>

  <button id="copyBtn">Copy citation</button>

  <details>
    <summary>Settings</summary>
    <label for="template">Citation template</label>
    <textarea id="template" rows="3"></textarea>
    <div class="row">
      <div>
        <label for="yearFormat">Tag year format</label>
        <select id="yearFormat">
          <option value="2">2-digit (e.g. 26)</option>
          <option value="4">4-digit (e.g. 2026)</option>
        </select>
      </div>
      <div>
        <label for="dateFormat">Date pattern</label>
        <input type="text" id="dateFormat" placeholder="M/d/yy">
      </div>
    </div>
    <div class="checkbox-row">
      <input type="checkbox" id="boldTag">
      <label for="boldTag">Copy the tagline (before ---) as bold + underlined</label>
    </div>
    <button class="secondary" id="saveSettingsBtn">Save settings</button>
  </details>

  <script src="extractor.js"></script>
  <script src="format.js"></script>
  <script src="popup.js"></script>
</body>
</html>
